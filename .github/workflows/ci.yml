name: ci
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: System packages (OCR + Japanese fonts for the test-card generator)
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-jpn fonts-noto-cjk fonts-ipafont-gothic
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Unit and API tests
        run: pytest -q
      - name: Accuracy gate on 40 freshly generated cards
        run: |
          python eval/gen_cards.py --out data/ci --n 40 --seed 3 --split test
          python eval/run_eval.py --data data/ci --configs default --min-mean-acc 0.80

  docker:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Build the image and check /health
        run: |
          docker build -t meishi .
          docker run -d -p 8000:8000 --name meishi meishi
          for i in $(seq 1 20); do curl -fs localhost:8000/health && exit 0; sleep 2; done; exit 1
