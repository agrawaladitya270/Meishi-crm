[project]
name = "meishi-ocr-crm"
version = "0.2.0"
requires-python = ">=3.10"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]  # FastAPI uses File(...) as a default on purpose

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff.lint.per-file-ignores]
"eval/*" = ["E501"]  # long lines of test data
